<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timers</title>
<style>
:root { --orange:#ff982e; --bg:#000; --face:#222; --muted:#555; --white:#f7f7f7; }
* { box-sizing:border-box; }
body { margin:0; min-height:100vh; background:var(--bg); color:var(--white); font-family:Arial,Helvetica,sans-serif; }
main { width:min(100%,1180px); margin:0 auto; padding:16px 24px 20px; }
h1 { color:var(--orange); font-size:clamp(2rem,4vw,3rem); margin:0 0 22px; font-weight:700; letter-spacing:-1px; }
.grid { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:clamp(12px,2vw,22px); }
.timer-tile { border:0; padding:0; aspect-ratio:1; border-radius:50%; background:var(--face); color:var(--white); cursor:pointer; display:flex; align-items:center; justify-content:center; flex-direction:column; position:relative; transition:transform .12s, background .12s; }
.timer-tile::before { content:""; position:absolute; inset:8px; border-radius:50%; border:5px dotted var(--orange); opacity:.95; pointer-events:none; }
.timer-tile:hover { background:#303030; transform:scale(1.025); }
.timer-tile:active { transform:scale(.98); }
.timer-tile .number { font-size:clamp(2.3rem,6vw,4rem); font-weight:300; line-height:1.05; }
.timer-tile .unit { color:var(--orange); font-size:clamp(1rem,2.4vw,1.55rem); font-weight:700; margin-top:8px; }
.add-tile { background:var(--orange); color:#000; }
.add-tile::before { border-color:#000; opacity:.28; }
.add-tile .plus { font-size:clamp(4rem,9vw,6rem); font-weight:300; line-height:1; margin-top:-8px; }
.add-tile:hover { background:#ffad52; }
.overlay { position:fixed; inset:0; background:rgba(0,0,0,.88); display:none; align-items:center; justify-content:center; padding:20px; z-index:5; }
.overlay.show { display:flex; }
.panel { width:min(100%,520px); background:#171717; border:1px solid #383838; border-radius:24px; padding:28px; box-shadow:0 20px 80px #000; }
.panel h2 { color:var(--orange); margin:0 0 24px; font-size:2rem; }
.fields { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
.field label { display:block; color:#bbb; text-align:center; margin-bottom:8px; font-size:.95rem; }
.field-input-wrap { position:relative; }
.field input { width:100%; background:#080808; color:var(--orange); border:1px solid #666; border-radius:12px; padding:14px 48px 14px 8px; font-size:2rem; text-align:center; outline:none; appearance:textfield; -moz-appearance:textfield; }
.field input:focus { border-color:var(--orange); }
.field input::-webkit-inner-spin-button,
.field input::-webkit-outer-spin-button { -webkit-appearance:none; margin:0; }
.stepper { position:absolute; right:4px; top:4px; bottom:4px; width:38px; display:flex; flex-direction:column; gap:2px; }
.stepper button { flex:1; border:0; padding:0; background:#292929; color:var(--orange); font-size:19px; font-weight:700; line-height:1; cursor:pointer; border-radius:7px; touch-action:manipulation; }
.stepper button:hover { background:#333; }
.stepper button:active { background:#555; }
.actions { display:flex; gap:12px; margin-top:24px; }
.actions button, .control-btn { border:0; border-radius:999px; padding:14px 22px; font-size:1.05rem; font-weight:700; cursor:pointer; }
.primary { background:var(--orange); color:#000; flex:1; }
.secondary { background:#333; color:#fff; }
#timerView { width:min(100%,660px); text-align:center; }
.timer-face { width:min(82vw, min(66vh, 580px)); aspect-ratio:1; margin:0 auto 26px; border-radius:50%; background:#171717; display:flex; align-items:center; justify-content:center; flex-direction:column; position:relative; }
.timer-face svg { position:absolute; inset:0; width:100%; height:100%; transform:rotate(-90deg); }
.timer-face .tick { stroke:#493019; stroke-width:3.2; stroke-linecap:round; transition:stroke .12s ease; }
.timer-face .tick.active { stroke:var(--orange); }
#timeLeft { position:relative; z-index:1; white-space:nowrap; font-size:clamp(4rem,10vw,8rem); font-weight:300; letter-spacing:-3px; font-variant-numeric:tabular-nums; line-height:1.12; }
.timer-face.long-time #timeLeft { font-size:clamp(2.9rem,7.2vw,5.7rem); letter-spacing:-2px; }
@media (max-width:700px) {
  #timeLeft { font-size:clamp(3rem,11vw,5rem); }
  .timer-face.long-time #timeLeft { font-size:clamp(2rem,7vw,3.5rem); }
}
#timerLabel { color:var(--orange); font-size:1.2rem; margin-top:4px; }
#timerStatus { color:#aaa; min-height:24px; margin:10px 0 20px; }
.timer-controls { display:flex; justify-content:center; gap:12px; flex-wrap:wrap; }
.timer-controls button { width:120px; min-width:120px; flex:0 0 120px; }
#doneMessage { color:var(--orange); font-size:1.15rem; min-height:28px; margin-bottom:12px; }
#runOverlay.done-screen #timerView { width:100%; }
#runOverlay.done-screen .timer-face { display:none; }
#runOverlay.done-screen #doneMessage {
  min-height:0;
  margin:0 0 34px;
  color:var(--orange);
  font-size:clamp(3rem,10vw,6rem);
  font-weight:700;
  letter-spacing:-2px;
  text-align:center;
}
#runOverlay.done-screen #timerStatus { display:none; }
#runOverlay.done-screen .timer-controls { justify-content:center; }
@media(max-width:700px) {
 main { padding:14px 14px 20px; }
 h1 { margin-bottom:18px; }
 .grid { grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
 .timer-tile::before { inset:5px; border-width:3px; }
 .timer-tile .unit { margin-top:4px; }
}
@media(max-width:380px) { .grid { gap:9px; } }

/* 13-inch iPad Pro landscape: keep every preset and the custom button above the fold. */
@media (min-width:1000px) and (max-height:850px) {
  main { padding-top:10px; padding-bottom:12px; }
  h1 { font-size:2.5rem; margin-bottom:14px; }
  .grid { gap:14px; }
  .timer-tile .number { font-size:clamp(2rem,4vw,3.2rem); }
  .timer-tile .unit { font-size:1.15rem; margin-top:4px; }
  .timer-tile::before { inset:6px; border-width:4px; }
}
</style>
</head>
<body>
<main>
  <h1>Timers</h1>
  <section class="grid" id="presetGrid" aria-label="Preset timers">
    <button class="timer-tile" data-seconds="30"><span class="number">30</span><span class="unit">SEC</span></button>
    <button class="timer-tile" data-seconds="60"><span class="number">1</span><span class="unit">MIN</span></button>
    <button class="timer-tile" data-seconds="120"><span class="number">2</span><span class="unit">MIN</span></button>
    <button class="timer-tile" data-seconds="180"><span class="number">3</span><span class="unit">MIN</span></button>
    <button class="timer-tile" data-seconds="300"><span class="number">5</span><span class="unit">MIN</span></button>
    <button class="timer-tile" data-seconds="600"><span class="number">10</span><span class="unit">MIN</span></button>
    <button class="timer-tile" data-seconds="900"><span class="number">15</span><span class="unit">MIN</span></button>
    <button class="timer-tile" data-seconds="1800"><span class="number">30</span><span class="unit">MIN</span></button>
    <button class="timer-tile" data-seconds="3600"><span class="number">1</span><span class="unit">HR</span></button>
    <button class="timer-tile add-tile" id="addTimer" aria-label="Add custom timer"><span class="plus">+</span></button>
  </section>
</main>

<div class="overlay" id="customOverlay" role="dialog" aria-modal="true" aria-labelledby="customTitle">
  <div class="panel">
    <h2 id="customTitle">Custom Timer</h2>
    <div class="fields">
      <div class="field"><label for="hours">Hours</label><div class="field-input-wrap"><input id="hours" type="number" min="0" max="99" value="0" inputmode="numeric"><div class="stepper"><button type="button" data-step="1" aria-label="Increase hours">▲</button><button type="button" data-step="-1" aria-label="Decrease hours">▼</button></div></div></div>
      <div class="field"><label for="minutes">Minutes</label><div class="field-input-wrap"><input id="minutes" type="number" min="0" max="59" value="5" inputmode="numeric"><div class="stepper"><button type="button" data-step="1" aria-label="Increase minutes">▲</button><button type="button" data-step="-1" aria-label="Decrease minutes">▼</button></div></div></div>
      <div class="field"><label for="seconds">Seconds</label><div class="field-input-wrap"><input id="seconds" type="number" min="0" max="59" value="0" inputmode="numeric"><div class="stepper"><button type="button" data-step="1" aria-label="Increase seconds">▲</button><button type="button" data-step="-1" aria-label="Decrease seconds">▼</button></div></div></div>
    </div>
    <div id="customError" role="alert" style="color:var(--orange); text-align:center; min-height:22px; margin-top:12px;"></div>
    <div class="actions">
      <button class="secondary" id="cancelCustom">Cancel</button>
      <button class="primary" id="createCustom">Start timer</button>
    </div>
  </div>
</div>

<div class="overlay" id="runOverlay" role="dialog" aria-modal="true" aria-label="Countdown timer">
  <div id="timerView">
    <div class="timer-face">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <g id="tickMarks"></g>
      </svg>
      <div id="timeLeft">05:00</div>
      <div id="timerLabel">5 MIN</div>
    </div>
    <div id="doneMessage"></div>
    <div id="timerStatus">Ready</div>
    <div class="timer-controls">
      <button class="control-btn secondary" id="closeTimer">Close</button>
      <button class="control-btn secondary" id="resetTimer">Reset</button>
      <button class="control-btn primary" id="pauseTimer">Pause</button>
    </div>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const customOverlay = $('customOverlay'), runOverlay = $('runOverlay');
  const tickGroup = $('tickMarks');
  const tickElements = [];
  // Sixty evenly spaced marks, like the Apple Watch countdown face.
  for (let i = 0; i < 60; i++) {
    const angle = (i * 2 * Math.PI) / 60;
    const inner = 82, outer = 91, cx = 100, cy = 100;
    const x1 = cx + Math.cos(angle) * inner;
    const y1 = cy + Math.sin(angle) * inner;
    const x2 = cx + Math.cos(angle) * outer;
    const y2 = cy + Math.sin(angle) * outer;
    const mark = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    mark.setAttribute('x1', x1.toFixed(2));
    mark.setAttribute('y1', y1.toFixed(2));
    mark.setAttribute('x2', x2.toFixed(2));
    mark.setAttribute('y2', y2.toFixed(2));
    mark.setAttribute('class', 'tick');
    tickGroup.appendChild(mark);
    tickElements.push(mark);
  }
  let duration = 0, remaining = 0, endAt = 0, animationFrame = null, running = false, audioContext = null, alarmNodes = [];

  function formatTime(total) {
    total = Math.max(0, Math.ceil(total));
    const h = Math.floor(total / 3600), m = Math.floor((total % 3600) / 60), s = total % 60;
    if (h > 0) return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }
  function labelFor(total) {
    const h = Math.floor(total / 3600);
    const m = Math.floor((total % 3600) / 60);
    const s = total % 60;
    const parts = [];
    if (h) parts.push(`${h} HR`);
    if (m) parts.push(`${m} MIN`);
    if (s) parts.push(`${s} SEC`);
    return parts.join(' ');
  }
  function render() {
    $('timeLeft').textContent = formatTime(remaining);
    document.querySelector('.timer-face').classList.toggle('long-time', duration >= 3600);
    $('timerLabel').textContent = labelFor(duration);
    const fraction = duration ? remaining / duration : 0;
    const litTicks = Math.ceil(fraction * tickElements.length);
    tickElements.forEach((mark, index) => {
      mark.classList.toggle('active', index < litTicks);
    });
  }
  function stopInterval() { if (animationFrame !== null) cancelAnimationFrame(animationFrame); animationFrame = null; }
  function stopAlarm() {
    alarmNodes.forEach(({ osc, gain }) => {
      try { gain.gain.cancelScheduledValues(audioContext.currentTime); } catch(e) {}
      try { gain.gain.setValueAtTime(0, audioContext.currentTime); } catch(e) {}
      try { osc.stop(audioContext.currentTime); } catch(e) {}
    });
    alarmNodes = [];
  }
  function beep() {
    stopAlarm();
    // Repeat a clear two-tone alarm for five seconds.
    try {
      audioContext = audioContext || new (window.AudioContext || window.webkitAudioContext)();
      if (audioContext.state === 'suspended') audioContext.resume();
      const startAt = audioContext.currentTime;
      const alarmLength = 5;
      const pulse = 0.28;
      for (let t = 0; t < alarmLength; t += pulse) {
        const start = startAt + t;
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        osc.type = 'sine';
        osc.frequency.value = (Math.floor(t / pulse) % 2 === 0) ? 880 : 660;
        gain.gain.setValueAtTime(0.001, start);
        gain.gain.exponentialRampToValueAtTime(0.2, start + 0.018);
        gain.gain.setValueAtTime(0.2, start + 0.16);
        gain.gain.exponentialRampToValueAtTime(0.001, start + 0.24);
        osc.connect(gain); gain.connect(audioContext.destination);
        osc.start(start); osc.stop(start + 0.25);
        alarmNodes.push({ osc, gain });
      }
    } catch(e) {}
  }
  function finish() {
    stopInterval(); running = false; remaining = 0; render();
    $('timerStatus').textContent = 'Timer complete';
    $('doneMessage').textContent = 'TIMER DONE';
    runOverlay.classList.add('done-screen');
    $('pauseTimer').textContent = 'Start Again';
    beep();
  }
  function tick() {
    // Keep fractional seconds for the ring so its movement stays fluid.
    remaining = Math.max(0, (endAt - Date.now()) / 1000);
    render();
    if (remaining <= 0) {
      finish();
    } else {
      animationFrame = requestAnimationFrame(tick);
    }
  }
  function start() {
    if (duration <= 0) return;
    // Starting or restarting always cancels any still-playing completion alarm.
    stopAlarm();
    if (remaining <= 0) remaining = duration;
    $('doneMessage').textContent = '';
    runOverlay.classList.remove('done-screen');
    $('timerStatus').textContent = 'Counting down';
    $('pauseTimer').textContent = 'Pause';
    running = true; endAt = Date.now() + remaining * 1000;
    stopInterval();
    animationFrame = requestAnimationFrame(tick);
  }
  function openTimer(seconds) {
    stopAlarm();
    stopInterval(); duration = seconds; remaining = seconds; running = false;
    $('timerStatus').textContent = 'Ready';
    $('doneMessage').textContent = '';
    $('pauseTimer').textContent = 'Start';
    render(); runOverlay.classList.remove('done-screen'); runOverlay.classList.add('show'); start();
  }
  document.querySelectorAll('.timer-tile[data-seconds]').forEach(tile => {
    tile.addEventListener('click', () => openTimer(Number(tile.dataset.seconds)));
  });
  // Explicit steppers keep the up/down arrows visible across browsers.
  document.querySelectorAll('.stepper button').forEach(button => {
    button.addEventListener('click', () => {
      const input = button.closest('.field-input-wrap').querySelector('input');
      const min = Number(input.min || 0);
      const max = Number(input.max || 999);
      const next = Math.max(min, Math.min(max, (Number(input.value) || 0) + Number(button.dataset.step)));
      input.value = next;
      input.dispatchEvent(new Event('change', { bubbles: true }));
    });
  });
  $('addTimer').addEventListener('click', () => {
    // Open the custom timer without focusing/selecting the Hours value.
    $('customError').textContent = '';
    customOverlay.classList.add('show');
  });
  $('cancelCustom').addEventListener('click', () => customOverlay.classList.remove('show'));
  $('createCustom').addEventListener('click', () => {
    const h = Math.max(0, Math.min(99, Number($('hours').value) || 0));
    const m = Math.max(0, Math.min(59, Number($('minutes').value) || 0));
    const s = Math.max(0, Math.min(59, Number($('seconds').value) || 0));
    const total = h * 3600 + m * 60 + s;
    if (!total) {
      $('customError').textContent = 'Choose a time greater than zero.';
      return;
    }
    $('customError').textContent = '';
    customOverlay.classList.remove('show');
    openTimer(total);
  });
  $('pauseTimer').addEventListener('click', () => {
    if (running) {
      // Pause directly from the clock; do not call tick(), which schedules
      // another animation frame while this click handler is trying to stop it.
      remaining = Math.max(0, (endAt - Date.now()) / 1000);
      stopInterval();
      running = false;
      if (remaining <= 0) {
        finish();
        return;
      }
      $('timerStatus').textContent = 'Paused';
      $('pauseTimer').textContent = 'Resume';
      render();
    } else {
      start();
    }
  });
  $('resetTimer').addEventListener('click', () => {
    stopAlarm();
    stopInterval(); running = false; remaining = duration;
    $('timerStatus').textContent = 'Reset'; $('doneMessage').textContent = '';
    runOverlay.classList.remove('done-screen');
    $('pauseTimer').textContent = 'Start'; render();
  });
  $('closeTimer').addEventListener('click', () => {
    stopAlarm();
    stopInterval(); running = false; runOverlay.classList.remove('show');
  });
  [customOverlay, runOverlay].forEach(overlay => overlay.addEventListener('click', e => {
    if (e.target === overlay && overlay === customOverlay) overlay.classList.remove('show');
  }));
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      customOverlay.classList.remove('show');
      if (runOverlay.classList.contains('show')) {
        stopAlarm();
        stopInterval();
        running = false;
        runOverlay.classList.remove('show');
      }
    }
  });
})();
</script>
</body>
</html>
