<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Classroom Timer</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif}
body{background:#fffbd2;color:#111}
.header{height:82px;background:#2f6cad;color:#fff;display:flex;align-items:center;padding:0 22px}
.title{font-size:52px;font-weight:400}
.page{padding:30px 5vw 50px}
.card{max-width:1050px;margin:auto;background:#5db0df;border:8px solid #9cdef3;border-radius:24px;box-shadow:0 10px 22px #0002;padding:30px}
.display{
  height:235px;background:#fffdf0;border:3px solid #78a9b8;border-radius:20px;
  position:relative;display:flex;align-items:center;justify-content:center;
}
.time-wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center;gap:0;position:relative}
.time{
  font-size:170px;font-weight:700;letter-spacing:-7px;font-variant-numeric:tabular-nums;
  width:190px;text-align:center;background:transparent;border:0;outline:0;
  color:#111;font-family:Arial,Helvetica,sans-serif;padding:0;cursor:text;
}
.time-separator{font-size:145px;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center;width:70px;color:#111}
.time-hint{position:absolute;right:105px;top:50%;transform:translateY(-50%);font-size:18px;line-height:1.15;text-align:left;color:#111;pointer-events:none}
.display.editing .time-hint{opacity:.85}
.time:focus{border:3px solid #9ac8ef;background:rgba(154,200,239,.22);border-radius:14px;outline:none}
.time:focus-visible{outline:none}
.fullscreen{background:#8bb8c8;font-size:15px}

.adjust{position:absolute;top:65px;bottom:65px;display:flex;flex-direction:column;justify-content:space-between}
.adjust.left{left:30px}.adjust.right{right:30px}
.arrow{width:40px;height:40px;border:0;border-radius:50%;background:#050505;color:white;font-size:21px;cursor:pointer}
.arrow:active,.button:active,.preset:active{transform:scale(.96)}
.controls{display:flex;justify-content:center;gap:32px;margin:24px 0}
.button{
  width:108px;height:108px;border-radius:50%;border:3px solid white;
  font-size:18px;letter-spacing:1px;cursor:pointer;box-shadow:0 4px 8px #0004
}
.start{background:#72d276}.dark{background:#123e55;color:#fff}.reset{background:#e9f4f7}
.presets{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:8px}
.label{font-size:19px;color:#eaf8ff;margin-right:4px}
.preset{
  border:0;background:#e8f5fa;border-radius:50%;min-width:56px;height:56px;
  padding:0 10px;font-size:17px;cursor:pointer;box-shadow:0 3px 6px #0002
}
.status{text-align:center;height:28px;font-size:18px;color:#eaf8ff;margin-top:3px}
.finished{animation:pulse .7s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:1}to{opacity:.65}}
.time-up-screen{position:fixed;inset:0;background:#bd4f3d;color:#fff;z-index:9999;display:none;align-items:center;justify-content:center;flex-direction:column;gap:42px;font-size:clamp(90px,13vw,210px);font-weight:400;font-family:Arial,Helvetica,sans-serif}
.time-up-screen.show{display:flex}
.time-up-exit{border:0;border-radius:50px;padding:16px 30px;background:#fff;color:#222;font-size:22px;font-weight:700;cursor:pointer;box-shadow:0 4px 10px #0003}
.time-up-exit:active{transform:scale(.97)}
@media(max-width:700px){
  .header{height:64px}.title{font-size:38px}
  .page{padding:15px 10px}.card{padding:15px;border-width:6px}
  .display{height:165px}.time{font-size:78px;width:95px;height:105px}.time-separator{font-size:68px;width:35px}.time-hint{font-size:12px;right:52px;top:12px;transform:none}
  .adjust{top:43px;bottom:43px}
  .button{width:82px;height:82px;font-size:15px}
  .controls{gap:18px}
}
</style>
</head>
<body>
<div class="time-up-screen" id="timeUpScreen"><div>Time's Up!</div><button class="time-up-exit" id="timeUpExit">BACK TO TIMER</button></div>
<header class="header"><div class="title">Classroom Timer</div></header>

<main class="page">
<section class="card">
  <div class="display" id="displayBox">
    <div class="time-wrap">
      <input class="time" id="minutes" value="01" inputmode="numeric" maxlength="4" aria-label="Minutes. ">
      <span class="time-separator">:</span>
      <input class="time" id="seconds" value="00" inputmode="numeric" maxlength="2" aria-label="Seconds.  from 0 to 59">
    </div>
    <div class="time-hint"></div>

    <div class="adjust left">
      <button class="arrow" id="minUp" title="Add one minute">▲</button>
      <button class="arrow" id="minDown" title="Subtract one minute">▼</button>
    </div>

    <div class="adjust right">
      <button class="arrow" id="secUp" title="Add one second">▲</button>
      <button class="arrow" id="secDown" title="Subtract one second">▼</button>
    </div>
  </div>

  <div class="status" id="status">READY</div>

  <div class="controls">
    <button class="button start" id="start">START</button>
    <button class="button dark" id="clear">CLEAR</button>
    <button class="button reset" id="reset">RESET</button>
    <button class="button fullscreen" id="fullscreen">FULL<br>SCREEN</button>
  </div>

  <div class="presets">
    <span class="label">PRESETS</span>
    <button class="preset" data-time="30">:30</button>
    <button class="preset" data-time="60">1</button>
    <button class="preset" data-time="120">2</button>
    <button class="preset" data-time="180">3</button>
    <button class="preset" data-time="240">4</button>
    <button class="preset" data-time="300">5</button>
    <button class="preset" data-time="600">10</button>
    <button class="preset" data-time="1200">20</button>
    <button class="preset" data-time="1800">30</button>
    <button class="preset" data-time="2400">40</button>
    <button class="preset" data-time="3000">50</button>
    <button class="preset" data-time="3600">1h</button>
  </div>
</section>
</main>

<script>
(function(){
  var selected=60;
  var remaining=60;
  var running=false;
  var timer=null;
  var last=0;

  var minutesInput=document.getElementById('minutes');
  var secondsInput=document.getElementById('seconds');
  var status=document.getElementById('status');
  var displayBox=document.getElementById('displayBox');
  var start=document.getElementById('start');
  var timeUpScreen=document.getElementById('timeUpScreen');

  function hideTimeUp(){
    timeUpScreen.classList.remove('show');
  }

  document.getElementById('timeUpExit').onclick=function(){
    hideTimeUp();
    status.textContent='READY';
    displayBox.classList.remove('finished');
  };

  document.addEventListener('keydown',function(e){
    if(e.key==='Escape' && timeUpScreen.classList.contains('show')){
      hideTimeUp();
      status.textContent='READY';
      displayBox.classList.remove('finished');
    }
  });

  function format(seconds){
    seconds=Math.max(0,Math.round(seconds));
    var m=Math.floor(seconds/60);
    var s=seconds%60;
    return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  }

  function render(){
    var value=format(running ? remaining : selected).split(':');
    minutesInput.value=value[0];
    secondsInput.value=value[1];
  }

  function commitTypedTime(){
    if(running){
      render();
      return;
    }

    var m=minutesInput.value.trim();
    var sec=secondsInput.value.trim();

    if(!/^\d+$/.test(m)) m='0';
     if(Number(m)>99) m='99';
     minutesInput.value=m;
    if(!/^\d+$/.test(sec)) sec='0';

    var minutes=Number(m);
    var seconds=Number(sec);

    if(seconds>60){
      seconds=60;
      secondsInput.value='60';
    }

    var totalSeconds=Math.min(minutes*60+seconds,359999);
    selected=totalSeconds;
    remaining=totalSeconds;
    status.textContent='READY';
    displayBox.classList.remove('finished');
    render();
  }


  function stop(){
    if(timer!==null){
      clearInterval(timer);
      timer=null;
    }
  }

  function tick(){
    if(!running)return;

    var now=Date.now();
    var elapsed=(now-last)/1000;
    last=now;

    remaining=Math.max(0,remaining-elapsed);
    var value=format(remaining).split(':');
    minutesInput.value=value[0];
    secondsInput.value=value[1];

    if(remaining<=0){
      running=false;
      remaining=selected;
      stop();
      start.textContent='START';
      status.textContent='TIME!';
      displayBox.classList.add('finished');
      render();
      timeUpScreen.classList.add('show');
    }
  }

  function begin(){
    stop();
    last=Date.now();
    timer=setInterval(tick,100);
  }

  function beginEditing(){
    if(running)return;
    displayBox.classList.add('editing');
  }

  function finishEditing(){
    displayBox.classList.remove('editing');
    commitTypedTime();
  }

  [minutesInput,secondsInput].forEach(function(input){
    input.addEventListener('focus',function(){
      beginEditing();
      input.select();
    });

    input.addEventListener('keydown',function(e){
      if(e.key==='Enter'){
        e.preventDefault();
        finishEditing();
        input.blur();
      }else if(e.key==='Escape'){
        render();
        displayBox.classList.remove('editing');
        input.blur();
      }
    });

    input.addEventListener('blur',function(){
      setTimeout(function(){
        if(document.activeElement!==minutesInput && document.activeElement!==secondsInput){
          finishEditing();
        }
      },0);
    });

    input.addEventListener('input',function(){
      // Allow convenient entry of a full time such as 5:23 in the minutes box,
      // while keeping the displayed colon itself fixed and non-editable.
      if(input===minutesInput && input.value.indexOf(':')!==-1){
        var parts=input.value.split(':');
        var typedMinutes=parts[0].replace(/\D/g,'');
        var typedSeconds=(parts[1]||'').replace(/\D/g,'').slice(0,2);
        minutesInput.value=typedMinutes.slice(0,4);
        secondsInput.value=typedSeconds;
        secondsInput.focus();
        secondsInput.select();
        return;
      }
      input.value=input.value.replace(/\D/g,'');
      if(input===secondsInput && Number(input.value)>59) input.value='59';
    });
  });


  document.getElementById('fullscreen').onclick=function(){
    var target=document.documentElement;

    if(!document.fullscreenElement && !document.webkitFullscreenElement){
      var request=target.requestFullscreen || target.webkitRequestFullscreen;
      if(request){
        var result=request.call(target);
        if(result && result.catch) result.catch(function(){});
      }
    }else{
      var exit=document.exitFullscreen || document.webkitExitFullscreen;
      if(exit){
        var result=exit.call(document);
        if(result && result.catch) result.catch(function(){});
      }
    }
  };

  function updateFullscreenButton(){
    var active=!!(document.fullscreenElement || document.webkitFullscreenElement);
    document.getElementById('fullscreen').innerHTML=active?'EXIT<br>FULL':'FULL<br>SCREEN';
  }

  document.addEventListener('fullscreenchange',updateFullscreenButton);
  document.addEventListener('webkitfullscreenchange',updateFullscreenButton);

  document.getElementById('minUp').onclick=function(){
    if(running)return;
    selected=Math.min(5940,selected+60);
    remaining=selected;
    render();
    status.textContent='READY';
    displayBox.classList.remove('finished');
    hideTimeUp();
  };

  document.getElementById('minDown').onclick=function(){
    if(running)return;
    selected=Math.max(0,selected-60);
    remaining=selected;
    render();
    status.textContent='READY';
    displayBox.classList.remove('finished');
    hideTimeUp();
  };

  document.getElementById('secUp').onclick=function(){
    if(running)return;
    selected=Math.min(6000,selected+1);
    remaining=selected;
    render();
    status.textContent='READY';
    displayBox.classList.remove('finished');
    hideTimeUp();
  };

  document.getElementById('secDown').onclick=function(){
    if(running)return;
    selected=Math.max(0,selected-1);
    remaining=selected;
    render();
    status.textContent='READY';
    displayBox.classList.remove('finished');
    hideTimeUp();
  };

  document.querySelectorAll('.preset').forEach(function(button){
    button.onclick=function(){
      if(running)return;
      selected=Number(button.getAttribute('data-time'));
      remaining=selected;
      render();
      status.textContent='READY';
      displayBox.classList.remove('finished');
      hideTimeUp();
    };
  });

  start.onclick=function(){
    hideTimeUp();
    if(running){
      running=false;
      stop();
      start.textContent='START';
      status.textContent='PAUSED';
      return;
    }

    if(remaining<=0){
      remaining=selected;
    }

    if(remaining<=0)return;

    running=true;
    start.textContent='PAUSE';
    status.textContent='RUNNING';
    displayBox.classList.remove('finished');
    var value=format(remaining).split(':');
    minutesInput.value=value[0];
    secondsInput.value=value[1];
    begin();
  };

  document.getElementById('clear').onclick=function(){
    stop();
    running=false;
    selected=0;
    remaining=0;
    start.textContent='START';
    status.textContent='READY';
    displayBox.classList.remove('finished');
    hideTimeUp();
    render();
  };

  document.getElementById('reset').onclick=function(){
    stop();
    running=false;
    remaining=selected;
    start.textContent='START';
    status.textContent='READY';
    displayBox.classList.remove('finished');
    hideTimeUp();
    render();
  };

  render();
})();
</script>
</body>
</html>
